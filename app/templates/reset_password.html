<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Trackr.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-card { background: var(--glass-bg); padding: 3rem; border-radius: 20px; border: 1px solid var(--glass-border); backdrop-filter: blur(20px); width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .auth-card h2 { text-align: center; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem;}
        .form-group input { width: 100%; padding: 0.75rem; border-radius: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; outline: none; transition: border-color 0.3s ease;}
        .form-group input:focus { border-color: var(--accent-purple); }
        .auth-btn { width: 100%; margin-top: 1rem; }
        .auth-links { text-align: center; margin-top: 1.5rem; font-size: 0.9rem;}
        .auth-links a { color: var(--accent-blue); text-decoration: none; }
    </style>
</head>
<body>
    <div class="bg-blob-1"></div><div class="bg-blob-2"></div>
    <div class="auth-container">
        <div class="auth-card animate">
            <div style="text-align: center; margin-bottom: 1rem;"><a href="/" class="logo" style="text-decoration:none;">Trackr.ai</a></div>
            <h2>Reset Password</h2>
            <form id="resetForm">
                <div class="form-group">
                    <label>Account Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="new_password" required>
                </div>
                <button type="submit" class="btn-primary auth-btn">Reset Password</button>
            </form>
            <div class="auth-links">Remembered it? <a href="/login">Log in</a></div>
        </div>
    </div>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const new_password = document.getElementById('new_password').value;
            const btn = e.target.querySelector('button');
            btn.textContent = 'Resetting...';
            
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, new_password })
            });
            
            if (res.ok) {
                alert('Password reset successfully! Please log in.');
                window.location.href = '/login';
            } else {
                const data = await res.json();
                alert(data.detail || 'Reset failed');
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
